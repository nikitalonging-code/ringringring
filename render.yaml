services:
  - type: web
    name: telegram-stars-pvp-wheel
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Render automatically injects the private Postgres connection string.
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-stars-pvp-db
          property: connectionString

      # Required only when connecting the Telegram bot.
      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: TELEGRAM_BOT_USERNAME
        sync: false

      # Render generates this securely for the Blueprint.
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true

      # Automatically resolves to this service's current public Render URL.
      - key: TELEGRAM_MINI_APP_SHORT_NAME
        sync: false
      - key: APP_PUBLIC_URL
        fromService:
          name: telegram-stars-pvp-wheel
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      # Put your numeric Telegram user ID here during initial Blueprint setup.
      - key: ADMIN_TELEGRAM_IDS
        sync: false

      - key: TELEGRAM_INIT_DATA_MAX_AGE
        value: "86400"

databases:
  - name: telegram-stars-pvp-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
